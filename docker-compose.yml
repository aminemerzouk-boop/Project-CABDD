# =====================================================================
# Architecture distribuée du mini-projet (variante A) : 3 conteneurs
#   - centre (port 5433) : référentiel + vue transparente sur les mesures
#   - zone1  (port 5434) : mesures de la zone 1 (Béjaïa, Jijel)
#   - zone2  (port 5435) : mesures de la zone 2 (Sétif, Bordj Bou Arréridj)
# Lancement :  docker compose up -d
# Exécution :  ./run_all.sh --docker
# =====================================================================
services:
  centre:
    image: postgres:16
    container_name: cabdd-centre
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centre
    ports:
      - "5433:5432"
    volumes:
      - .:/data          # montage du projet (data/, sql/) dans /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centre"]
      interval: 3s
      retries: 10

  zone1:
    image: postgres:16
    container_name: cabdd-zone1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zone1
    ports:
      - "5434:5432"
    volumes:
      - .:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zone1"]
      interval: 3s
      retries: 10

  zone2:
    image: postgres:16
    container_name: cabdd-zone2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zone2
    ports:
      - "5435:5432"
    volumes:
      - .:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zone2"]
      interval: 3s
      retries: 10

networks:
  default:
    name: reseau-capteurs   # les conteneurs se voient sous les noms centre/zone1/zone2
