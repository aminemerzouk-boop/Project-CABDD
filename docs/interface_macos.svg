<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="z1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0055d4"/>
    </linearGradient>
    <linearGradient id="z2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#1d9e45"/>
    </linearGradient>
  </defs>

  <!-- bureau macOS (dégradé sombre discret) -->
  <rect width="1280" height="800" rx="0" fill="#2b2f3a"/>

  <!-- fenêtre macOS -->
  <rect x="60" y="50" width="1160" height="700" rx="14" fill="#f5f5f7" filter="url(#winShadow)"/>

  <!-- barre de titre macOS : traffic lights + titre centré minimal -->
  <rect x="60" y="50" width="1160" height="44" rx="14" fill="#ececee"/>
  <rect x="60" y="72" width="1160" height="22" fill="#ececee"/>
  <line x1="60" y1="94" x2="1220" y2="94" stroke="#d8d8dc"/>
  <circle cx="86" cy="72" r="6" fill="#ff5f57"/>
  <circle cx="106" cy="72" r="6" fill="#febc2e"/>
  <circle cx="126" cy="72" r="6" fill="#28c840"/>
  <text x="640" y="77" font-size="13" font-weight="600" fill="#3c3c43" text-anchor="middle" opacity="0.85">CABDD</text>

  <!-- sidebar translucide macOS -->
  <rect x="60" y="94" width="220" height="656" fill="#e9e9ec" opacity="0.85"/>
  <line x1="280" y1="94" x2="280" y2="750" stroke="#d8d8dc"/>

  <!-- icônes + labels très courts -->
  <g font-size="13" fill="#3c3c43">
    <rect x="76" y="122" width="188" height="34" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <circle cx="96" cy="139" r="7" fill="#0a84ff"/>
    <text x="112" y="144" font-weight="600">Vue d'ensemble</text>

    <circle cx="96" cy="181" r="7" fill="#8e8e93"/>
    <text x="112" y="186">Centre</text>

    <circle cx="96" cy="217" r="7" fill="#8e8e93"/>
    <text x="112" y="222">Zone 1</text>

    <circle cx="96" cy="253" r="7" fill="#8e8e93"/>
    <text x="112" y="258">Zone 2</text>

    <circle cx="96" cy="289" r="7" fill="#8e8e93"/>
    <text x="112" y="294">Bilan XML</text>

    <circle cx="96" cy="325" r="7" fill="#8e8e93"/>
    <text x="112" y="330">Tests</text>
  </g>

  <!-- avatar bas de sidebar -->
  <circle cx="96" cy="716" r="14" fill="#0a84ff"/>
  <text x="96" y="721" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">S</text>
  <text x="118" y="721" font-size="12" fill="#3c3c43">Samou</text>

  <!-- ================= CONTENU : gros chiffres, peu de texte ================= -->
  <text x="308" y="140" font-size="28" font-weight="700" fill="#1d1d1f">Vue d'ensemble</text>

  <!-- 3 grandes cartes chiffrées -->
  <rect x="308" y="164" width="280" height="130" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <text x="332" y="212" font-size="40" font-weight="700" fill="#1d1d1f">33 280</text>
  <text x="332" y="240" font-size="13" fill="#8e8e93">mesures valides</text>
  <circle cx="560" cy="192" r="4" fill="#30d158"/>

  <rect x="604" y="164" width="280" height="130" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <text x="628" y="212" font-size="40" font-weight="700" fill="#1d1d1f">694</text>
  <text x="628" y="240" font-size="13" fill="#8e8e93">mesures isolées</text>
  <circle cx="856" cy="192" r="4" fill="#ff9f0a"/>

  <rect x="900" y="164" width="280" height="130" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <text x="924" y="212" font-size="40" font-weight="700" fill="#1d1d1f">12</text>
  <text x="924" y="240" font-size="13" fill="#8e8e93">stations · 2 zones</text>
  <circle cx="1156" cy="192" r="4" fill="#0a84ff"/>

  <!-- carte graphique : répartition zone1 / zone2, minimal -->
  <rect x="308" y="314" width="872" height="200" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <!-- anneau -->
  <circle cx="420" cy="414" r="56" fill="none" stroke="#e5e5ea" stroke-width="20"/>
  <circle cx="420" cy="414" r="56" fill="none" stroke="url(#z1)" stroke-width="20"
          stroke-dasharray="176 352" transform="rotate(-90 420 414)" stroke-linecap="round"/>
  <circle cx="420" cy="414" r="56" fill="none" stroke="url(#z2)" stroke-width="20"
          stroke-dasharray="176 352" stroke-dashoffset="-176" transform="rotate(-90 420 414)" stroke-linecap="round"/>
  <text x="420" y="421" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="middle">50/50</text>

  <circle cx="540" cy="392" r="6" fill="#0a84ff"/>
  <text x="556" y="397" font-size="14" fill="#3c3c43">Zone 1 — Béjaïa · Jijel</text>
  <circle cx="540" cy="428" r="6" fill="#30d158"/>
  <text x="556" y="433" font-size="14" fill="#3c3c43">Zone 2 — Sétif · BBA</text>
  <text x="820" y="421" font-size="13" fill="#8e8e93" text-anchor="end">IDs impairs / pairs — unicité réseau</text>

  <!-- carte bilan XML : extrait très court -->
  <rect x="308" y="534" width="420" height="190" rx="16" fill="#1d1d1f" filter="url(#soft)"/>
  <text x="332" y="566" font-size="12" fill="#7ee787" font-family="SF Mono, Consolas, monospace">&lt;bilanjournalier debut="2026-02-01"…&gt;</text>
  <text x="332" y="590" font-size="12" fill="#79c0ff" font-family="SF Mono, Consolas, monospace">  &lt;station code="BJ-01" zone="1"&gt;</text>
  <text x="332" y="614" font-size="12" fill="#ffa657" font-family="SF Mono, Consolas, monospace">    &lt;grandeur nom="temperature" nbMesures="8"/&gt;</text>
  <text x="332" y="638" font-size="12" fill="#79c0ff" font-family="SF Mono, Consolas, monospace">  &lt;/station&gt;</text>
  <text x="332" y="662" font-size="12" fill="#7ee787" font-family="SF Mono, Consolas, monospace">&lt;/bilanjournalier&gt;</text>
  <text x="332" y="700" font-size="11" fill="#8e8e93" font-family="SF Mono, Consolas, monospace">exécuté depuis le centre · z1_mes ∪ z2_mes</text>

  <!-- petite carte action -->
  <rect x="748" y="534" width="432" height="190" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <rect x="772" y="560" width="180" height="38" rx="10" fill="#0a84ff"/>
  <text x="862" y="584" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Bilan XML</text>
  <rect x="964" y="560" width="180" height="38" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="1054" y="584" font-size="14" font-weight="600" fill="#0a84ff" text-anchor="middle">EXPLAIN</text>
  <text x="772" y="640" font-size="13" fill="#8e8e93">Pruning mensuel vérifié · panne zone tolérée</text>
  <text x="772" y="664" font-size="13" fill="#8e8e93">33 974 = 33 280 valides + 694 isolées</text>
</svg>
